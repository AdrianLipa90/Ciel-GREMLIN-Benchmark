name: GREMLIN benchmark receipt artifact

on:
  pull_request:
    paths:
      - 'dataset/**'
      - 'src/ciel_gremlin_benchmark/gremlin_receipts.py'
      - 'src/ciel_gremlin_benchmark/cli.py'
      - 'tests/test_gremlin_receipts.py'
      - 'COMPONENT_PINS_V0_1.json'
      - '.github/workflows/gremlin-receipt-artifact.yml'

permissions:
  contents: read

jobs:
  build-gremlin-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark and pinned GREMLIN
        run: |
          python -m pip install -e . pytest
          python -m pip install 'git+https://github.com/AdrianLipa90/GREMLIN.git@7b80db8dd7a553c77616427a91bade608e12b968'
      - name: Run benchmark contract suite
        run: python -m pytest -q
      - name: Build native GREMLIN receipt bundle
        run: >-
          python -m ciel_gremlin_benchmark.cli build-gremlin-receipts
          --dataset dataset/golden_v0_1.jsonl
          --output artifacts/gremlin_receipts.jsonl
      - name: Verify receipt coverage
        run: python -c "import json; from pathlib import Path; rows=[json.loads(x) for x in Path('artifacts/gremlin_receipts.jsonl').read_text().splitlines() if x.strip()]; assert len(rows)==60; assert len({r['task_id'] for r in rows})==60; print('GREMLIN receipt coverage: 60/60')"
      - uses: actions/upload-artifact@v4
        with:
          name: gremlin-receipts-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/gremlin_receipts.jsonl
          if-no-files-found: error

name: Benchmark dynamic gate CI

on:
  pull_request:
    paths:
      - 'src/ciel_gremlin_benchmark/**'
      - 'tests/**'
      - 'DYNAMIC_GATE_PROTOCOL.md'
      - '.github/workflows/benchmark-dynamic-gate-ci.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark-invariants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install benchmark and tests
        run: python -m pip install -e . pytest
      - name: Compile benchmark package
        run: python -m compileall -q src
      - name: Run complete benchmark test suite
        run: python -m pytest -q
